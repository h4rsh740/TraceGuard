version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: traceguard-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-traceguard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-traceguard}
      POSTGRES_DB: ${POSTGRES_DB:-traceguard_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-traceguard} -d ${POSTGRES_DB:-traceguard_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: traceguard-api
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-traceguard}:${POSTGRES_PASSWORD:-traceguard}@postgres:5432/${POSTGRES_DB:-traceguard_db}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: traceguard-web
    restart: always
    env_file:
      - .env
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
